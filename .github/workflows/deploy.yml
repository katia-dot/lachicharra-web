name: Publicar en lachicharra.mx

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subir archivos por FTP a cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.lachicharra.mx
          username: webclaude@lachicharra.mx
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
